<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Gap Mining</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="../shared/app.css">
  <script src="../shared/install.js" defer></script>
  <script src="app.js" type="module"></script>
</head>
<body>
  <header>
    <h1>Gap Mining</h1>
    <button id="install" class="install" type="button">Install app</button>
  </header>
  <p id="install-help" class="help" hidden></p>
  <main>
    <section>
      <h2>New gap</h2>
      <form id="add">
        <div class="row" style="margin-bottom:12px">
          <input id="name" placeholder="Opportunity" required maxlength="80" aria-label="Opportunity">
          <select id="type" aria-label="Gap type"></select>
        </div>
        <div id="sliders"></div>
        <div class="row"><button type="submit">Score &amp; save</button><strong id="preview"></strong></div>
      </form>
    </section>
    <section>
      <h2>Ranked gaps</h2>
      <ol id="list"></ol>
    </section>
  </main>
  <footer>
    <div class="row">
      <button id="export" type="button">Export backup</button>
      <button id="import" type="button">Import backup</button>
      <input id="import-file" type="file" accept="application/json" hidden>
    </div>
    <p class="muted">Data is saved on this device. Use Export/Import to move it between phone and PC.</p>
  </footer>
</body>
</html>
