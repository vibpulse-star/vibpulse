name: Launch Engine

# Tests, then builds the standalone apps:
#   Android: launch-engine.apk (offline WebView shell)    Windows: launch-engine-windows.zip (installer + app)
# Outside PRs, publishes them to a rolling release with fixed links:
#   https://github.com/<owner>/<repo>/releases/download/launch-engine/<file>
on:
  push:
    paths: ["launch-engine/**", ".github/workflows/launch-engine.yml"]
  pull_request:
    paths: ["launch-engine/**", ".github/workflows/launch-engine.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Unit tests
        working-directory: launch-engine
        run: python test_launch.py && node tests/engine.test.mjs
      - name: Committed app data matches tasks.toml + projects/
        working-directory: launch-engine
        run: python launch.py export && git diff --exit-code app/data.json

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Use the stable signing key if configured
        # Without it each build has a new key: phones refuse the update, and uninstalling erases the app's data.
        if: env.KEYSTORE_B64 != ''
        run: mkdir -p ~/.android && echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - name: Build APK (also bundles dist/launch-engine.html)
        working-directory: launch-engine/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Package
        run: |
          mkdir -p out/win
          cp launch-engine/android/app/build/outputs/apk/debug/app-debug.apk out/launch-engine.apk
          cp launch-engine/dist/launch-engine.html out/launch-engine.html
          cp launch-engine/dist/launch-engine.html launch-engine/windows/* out/win/
          (cd out/win && zip -q ../launch-engine-windows.zip *)
      - uses: actions/upload-artifact@v4
        with:
          name: launch-engine
          path: |
            out/launch-engine.apk
            out/launch-engine-windows.zip
            out/launch-engine.html
      - name: Publish download links
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=launch-engine
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Launch Engine (latest)" \
            --notes "Android: install launch-engine.apk. Windows: unzip launch-engine-windows.zip, run Install.cmd." \
            --target "$GITHUB_SHA" --prerelease
          gh release upload "$tag" out/launch-engine-windows.zip out/launch-engine.html --clobber
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          echo "Windows: $base/launch-engine-windows.zip" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$KEYSTORE_B64" ]; then
            gh release upload "$tag" out/launch-engine.apk --clobber
            echo "Android: $base/launch-engine.apk" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::APK not published: set secret ANDROID_DEBUG_KEYSTORE_B64 first, or every update would force an uninstall that erases phone data. The APK is still in this run's artifacts for testing."
            echo "Android APK NOT published (no stable signing key). See README." >> "$GITHUB_STEP_SUMMARY"
          fi
