name: Build launcher APKs

on:
  push:
    paths: ["launchers/**", ".github/workflows/launchers.yml"]
  pull_request:
    paths: ["launchers/**", ".github/workflows/launchers.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [gap-mining, war-room, skill-tree]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK
        working-directory: launchers/${{ matrix.app }}/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: launchers/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
